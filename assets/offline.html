<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A3161">
<title>Hors ligne — Le Corridor Intelligence</title>
<style>
  :root{
    --ink:#0A3161; --panel:#0E3A70; --gold:#D4AF37; --gold-h:#E6C860;
    --bone:#F2EFE9; --muted:#A9A39A; --line:rgba(242,239,233,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:var(--bone);
    font-family:"EB Garamond",Georgia,"Times New Roman",serif;
    background-image:radial-gradient(ellipse 120% 70% at 50% -8%, rgba(201,162,39,.07), transparent);
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px;
  }
  .wrap{max-width:560px}
  .mark{
    width:96px;height:96px;border-radius:50%;margin:0 auto 28px;
    border:1px solid var(--gold); display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    font-family:"Oswald","Arial Narrow",sans-serif;font-weight:600;font-size:38px;letter-spacing:.06em;
  }
  .eyebrow{
    font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;
    text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:var(--gold);margin:0 0 14px;
  }
  h1{
    font-family:"Oswald","Arial Narrow",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;font-size:30px;line-height:1.1;margin:0 0 16px;
  }
  p{font-size:19px;line-height:1.6;color:var(--bone);margin:0 0 28px}
  .muted{color:var(--muted);font-size:15px}
  button{
    font-family:"Oswald","Arial Narrow",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.12em;font-size:14px;cursor:pointer;
    background:var(--gold); color:#0A1A2F; border:0; border-radius:2px; padding:14px 30px;
  }
  button:hover{background:var(--gold-h)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">CI</div>
    <p class="eyebrow">Le Corridor Intelligence</p>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n’est pas encore dans le cache de votre appareil. Tout ce que vous avez déjà ouvert reste lisible hors ligne — reconnectez-vous pour charger les dernières parutions.</p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="muted" style="margin-top:28px">Renseignement stratégique pour décideurs.</p>
  </div>
</body>
</html>
